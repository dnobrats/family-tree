<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cây Gia Phả Chuyên Nghiệp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary-color: #7a3e22;
        --female-color: #9d5a66;
        --line-color: #8d6747;
        --bg-color: #ead8b7;
        --bg-color-soft: #f2e5ca;
        --paper-deep: #d2b48c;
        --paper-border: #9c6f46;
        --ink-main: #392616;
      }

      body {
        font-family: "Be Vietnam Pro", "Helvetica Neue", sans-serif;
        background:
          radial-gradient(circle at 20% 10%, rgba(255, 255, 255, 0.35), transparent 28%),
          radial-gradient(circle at 85% 5%, rgba(181, 121, 72, 0.14), transparent 25%),
          repeating-linear-gradient(
            -15deg,
            rgba(125, 84, 45, 0.04),
            rgba(125, 84, 45, 0.04) 2px,
            transparent 2px,
            transparent 8px
          ),
          linear-gradient(140deg, var(--bg-color), var(--bg-color-soft));
        margin: 0;
        padding: 0;
        color: var(--ink-main);
      }

      header {
        display: flex;
        gap: 20px;
        align-items: center;
        justify-content: center;
        background: rgba(245, 229, 199, 0.86);
        border-bottom: 1px solid rgba(122, 62, 34, 0.35);
        padding: 15px 30px;
        box-shadow: 0 6px 20px rgba(80, 45, 18, 0.18);
        position: sticky;
        top: 0;
        z-index: 100;
        backdrop-filter: blur(4px);
      }

      .control-group {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        font-weight: 600;
      }

      select,
      input {
        padding: 8px 12px;
        border: 1px solid rgba(122, 62, 34, 0.34);
        background: rgba(255, 251, 240, 0.88);
        border-radius: 6px;
        outline: none;
        transition: border 0.2s;
        color: var(--ink-main);
      }
      select:focus,
      input:focus {
        border-color: var(--primary-color);
      }

      .tree-container {
        position: relative;
        width: 100%;
        min-height: calc(100vh - 80px);
        overflow: auto;
        padding: 80px 40px;
        box-sizing: border-box;
      }

      .tree {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        position: relative;
      }

      .family {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0 15px;
        position: relative;
      }

      .couple {
        display: flex;
        gap: 12px;
        margin-bottom: 50px;
        position: relative;
        z-index: 10;
      }

      .node {
        font-family: "Noto Serif", "Be Vietnam Pro", serif;
        border: 2px solid var(--paper-border);
        background:
          linear-gradient(160deg, rgba(255, 248, 229, 0.96), rgba(236, 215, 180, 0.95));
        cursor: pointer;
        text-align: center;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        box-shadow:
          0 8px 18px rgba(70, 38, 18, 0.18),
          inset 0 0 0 2px rgba(255, 247, 226, 0.75);
        min-width: 140px;
        position: relative;
        color: #4a2d1a;
        letter-spacing: 0.02em;
      }

      .node:hover {
        transform: translateY(-4px);
        box-shadow:
          0 14px 24px rgba(74, 42, 20, 0.24),
          inset 0 0 0 2px rgba(255, 247, 226, 0.85);
      }
      .node::before {
        content: "";
        position: absolute;
        inset: 5px;
        border: 1px solid rgba(123, 72, 42, 0.45);
        border-radius: 6px;
        pointer-events: none;
      }
      .node::after {
        content: "❖";
        position: absolute;
        top: 5px;
        right: 8px;
        font-size: 10px;
        color: rgba(122, 62, 34, 0.52);
      }
      .node.female {
        border-color: var(--female-color);
      }
      .node.female::before {
        border-color: rgba(157, 90, 102, 0.48);
      }
      .node.dead {
        background: linear-gradient(160deg, rgba(227, 209, 179, 0.92), rgba(212, 188, 153, 0.92));
        color: #6f5845;
        border-color: #967457;
      }

      .gen-1 {
        font-size: 24px;
        font-weight: 800;
        padding: 20px 35px;
        border-width: 4px;
        min-width: 180px;
      }
      .gen-2 {
        font-size: 19px;
        font-weight: 700;
        padding: 15px 25px;
        border-width: 3px;
      }
      .gen-3 {
        font-size: 16px;
        font-weight: 600;
        padding: 12px 20px;
      }
      .gen-4 {
        font-size: 14px;
        font-weight: 500;
        padding: 10px 18px;
      }
      .gen-5 {
        font-size: 12px;
        font-weight: 400;
        padding: 8px 15px;
      }

      .children {
        display: flex;
        gap: 30px;
        justify-content: center;
        position: relative;
      }

      svg#lines {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
        overflow: visible;
        z-index: 1;
      }

      .popup {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.6);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        backdrop-filter: blur(4px);
      }
      .popup-content {
        background: linear-gradient(150deg, #fff7e4, #eed7b2);
        border: 2px solid rgba(122, 62, 34, 0.35);
        padding: 30px;
        width: 380px;
        border-radius: 16px;
        position: relative;
        box-shadow: 0 20px 35px rgba(52, 27, 10, 0.35);
      }
      .title-banner {
        font-family: "Noto Serif", "Be Vietnam Pro", serif;
        letter-spacing: 0.12em;
      }
      .close-btn {
        position: absolute;
        top: 15px;
        right: 20px;
        cursor: pointer;
        font-size: 24px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <header>
      <div
        class="title-banner"
        style="
          font-size: 1.2rem;
          font-weight: 800;
          color: var(--primary-color);
          margin-right: 20px;
        "
      >
        CÂY GIA PHẢ
      </div>

      <div class="control-group">
        <span>Chi:</span>
        <select id="clanSelect">
          <option value="root">Toàn bộ</option>
          <option value="1">Chi 1</option>
          <option value="2">Chi 2</option>
        </select>
      </div>

      <div class="control-group">
        <span>Hiển thị:</span>
        <input
          type="number"
          id="maxGen"
          value="5"
          min="1"
          max="10"
          style="width: 50px"
        />
        <span>đời</span>
      </div>

      <div class="control-group">
        <span>Tìm:</span>
        <input id="searchBox" placeholder="Nhập tên..." />
      </div>
    </header>

    <div class="tree-container" id="treeContainer">
      <svg id="lines"></svg>
      <div id="tree" class="tree"></div>
    </div>

    <div id="popup" class="popup" onclick="closePopup()">
      <div class="popup-content" onclick="event.stopPropagation()">
        <span class="close-btn" onclick="closePopup()">&times;</span>
        <h3
          id="pName"
          style="
            margin-top: 0;
            color: var(--text-main);
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
          "
        ></h3>
        <div id="pInfo" style="line-height: 1.8"></div>
      </div>
    </div>

    <script>
      let allNodes = [];
      let nodeMap = {};

      async function load() {
        document.getElementById("clanSelect").onchange = reloadTree;
        document.getElementById("maxGen").onchange = reloadTree;
        document.getElementById("searchBox").oninput = handleSearch;
        await reloadTree();
      }

      async function reloadTree() {
        const sel = document.getElementById("clanSelect").value;
        const maxGen = parseInt(document.getElementById("maxGen").value) || 5;

        let url =
          sel === "root" ? "/api/tree?root=1" : `/api/clans/${sel}/tree`;

        try {
          const res = await fetch(url);
          const data = await res.json();
          allNodes = data.nodes;

          nodeMap = {};
          allNodes.forEach((n) => (nodeMap[n.id] = n));

          const rootId = data.root_id || data.clan?.root_person_id;
          const rootPerson =
            nodeMap[rootId] ||
            allNodes.find((n) => !n.father_id && !n.mother_id);

          const treeEl = document.getElementById("tree");
          treeEl.innerHTML = "";

          if (rootPerson) {
            treeEl.appendChild(renderRecursive(rootPerson, 1, maxGen));
            setTimeout(drawLines, 100);
          }
        } catch (e) {
          console.error("Lỗi tải dữ liệu gia phả:", e);
        }
      }

      function renderRecursive(person, currentGen, maxGen, renderedIds = new Set()) {
        if (currentGen > maxGen) return null;
        if (renderedIds.has(person.id)) return null; // Tránh render duplicate
        
        renderedIds.add(person.id);

        const familyDiv = document.createElement("div");
        familyDiv.className = "family";

        const coupleDiv = document.createElement("div");
        coupleDiv.className = "couple";
        coupleDiv.appendChild(renderNode(person, currentGen));

        // Lấy con của person này
        const children = allNodes.filter(
          (n) => (n.father_id === person.id || n.mother_id === person.id) && n.id !== person.id,
        );

        // Tìm spouse (vợ/chồng) từ con đầu tiên
        const spouseId =
          children.length > 0
            ? children[0].father_id === person.id
              ? children[0].mother_id
              : children[0].father_id
            : null;

        if (spouseId && nodeMap[spouseId] && !renderedIds.has(spouseId)) {
          coupleDiv.appendChild(renderNode(nodeMap[spouseId], currentGen));
          renderedIds.add(spouseId);
        }
        familyDiv.appendChild(coupleDiv);

        if (children.length > 0 && currentGen < maxGen) {
          const childrenDiv = document.createElement("div");
          childrenDiv.className = "children";

          // Loại bỏ duplicate children
          const uniqueKids = Array.from(new Set(children.map((c) => c.id)))
            .map((id) => nodeMap[id])
            .filter((child) => !renderedIds.has(child.id));
          
          uniqueKids.sort((a, b) => (a.birth_year || 0) - (b.birth_year || 0));

          uniqueKids.forEach((child) => {
            const childFamily = renderRecursive(child, currentGen + 1, maxGen, renderedIds);
            if (childFamily) childrenDiv.appendChild(childFamily);
          });

          if (childrenDiv.hasChildNodes()) familyDiv.appendChild(childrenDiv);
        }

        return familyDiv;
      }

      function renderNode(p, gen) {
        const box = document.createElement("div");
        const genClass = `gen-${Math.min(gen, 5)}`;
        box.className = `node ${genClass}`;

        if (!p.is_alive) box.classList.add("dead");
        if (p.gender === 0 || p.gender === 2) box.classList.add("female");

        box.innerHTML = `<span>${p.full_name}</span>`;
        box.onclick = () => showDetail(p.id);
        return box;
      }

      function getRelativeRect(el, container) {
        const elRect = el.getBoundingClientRect();
        const containerRect = container.getBoundingClientRect();
        return {
          top: elRect.top - containerRect.top + container.scrollTop,
          left: elRect.left - containerRect.left + container.scrollLeft,
          bottom: elRect.bottom - containerRect.top + container.scrollTop,
          right: elRect.right - containerRect.left + container.scrollLeft,
          width: elRect.width,
          height: elRect.height,
        };
      }

      function drawLines() {
        const svg = document.getElementById("lines");
        const container = document.getElementById("treeContainer");
        const tree = document.getElementById("tree");
        if (!tree) return;

        svg.innerHTML = "";

        // Size SVG to match tree scroll dimensions
        svg.setAttribute("width", tree.scrollWidth);
        svg.setAttribute("height", tree.scrollHeight);
        svg.style.width = tree.scrollWidth + "px";
        svg.style.height = tree.scrollHeight + "px";

        document.querySelectorAll(".family").forEach((fam) => {
          const couple = fam.querySelector(":scope > .couple");
          const childrenWrap = fam.querySelector(":scope > .children");
          if (!couple || !childrenWrap) return;

          const coupleRect = getRelativeRect(couple, container);

          // Start line from bottom-center of the couple div
          const startX = coupleRect.left + coupleRect.width / 2;
          const startY = coupleRect.bottom;

          const childFamilies =
            childrenWrap.querySelectorAll(":scope > .family");
          if (childFamilies.length === 0) return;

          const childCenters = [];

          childFamilies.forEach((cfam) => {
            const childCouple = cfam.querySelector(":scope > .couple");
            if (!childCouple) return;

            // Find first node in child couple
            const childNode = childCouple.querySelector(".node");
            if (!childNode) return;

            const r = getRelativeRect(childNode, container);
            const cx = r.left + r.width / 2;
            const cy = r.top; // top edge of child node

            childCenters.push({ x: cx, y: cy });
          });

          if (childCenters.length === 0) return;

          const minChildY = Math.min(...childCenters.map((p) => p.y));
          // midpoint Y is halfway between parent bottom and topmost child top
          const midY = startY + (minChildY - startY) / 2;

          // 1. Parent down to midY
          createLine(startX, startY, startX, midY, svg);

          // 2. Horizontal bar across all children
          const minX = Math.min(...childCenters.map((p) => p.x));
          const maxX = Math.max(...childCenters.map((p) => p.x));
          createLine(minX, midY, maxX, midY, svg);

          // 3. From horizontal bar down to each child node top
          childCenters.forEach((p) => {
            createLine(p.x, midY, p.x, p.y, svg);
          });
        });
      }

      function createLine(x1, y1, x2, y2, container) {
        const lineColor = getComputedStyle(document.documentElement)
          .getPropertyValue("--line-color")
          .trim() || "#8d6747";
        const line = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "line",
        );
        line.setAttribute("x1", x1);
        line.setAttribute("y1", y1);
        line.setAttribute("x2", x2);
        line.setAttribute("y2", y2);
        line.setAttribute("stroke", lineColor);
        line.setAttribute("stroke-width", "2");
        container.appendChild(line);
      }

      function handleSearch() {
        const q = document.getElementById("searchBox").value.toLowerCase();
        document.querySelectorAll(".node").forEach((n) => {
          const match = n.textContent.toLowerCase().includes(q);
          n.style.opacity = match ? "1" : "0.2";
          n.style.boxShadow =
            match && q !== "" ? "0 0 0 4px rgba(59, 130, 246, 0.5)" : "";
        });
      }

      async function showDetail(id) {
        try {
          const res = await fetch("/api/persons/" + id);
          const p = await res.json();
          document.getElementById("pName").textContent = p.full_name;
          
          let spousesHtml = '';
          if (p.spouses && p.spouses.length > 0) {
            spousesHtml = '<p><strong>Vợ/Chồng:</strong></p><ul style="margin: 5px 0; padding-left: 20px;">';
            p.spouses.forEach(sp => {
              const year = sp.marriage_year ? ` - Kết hôn: ${sp.marriage_year}` : '';
              const birthYear = sp.spouse_birth_year ? ` (${sp.spouse_birth_year})` : '';
              const alive = sp.spouse_is_alive ? '✓' : '✝';
              spousesHtml += `<li>${alive} ${sp.spouse_name}${birthYear}${year}</li>`;
            });
            spousesHtml += '</ul>';
          }

          document.getElementById("pInfo").innerHTML = `
            <p><strong>Giới tính:</strong> ${p.gender === 1 ? "Nam" : "Nữ"}</p>
            <p><strong>Năm sinh:</strong> ${p.birth_year || "Không rõ"}</p>
            <p><strong>Trạng thái:</strong> ${p.is_alive ? "Còn sống" : "Đã mất"}</p>
            ${spousesHtml}
            ${p.address ? `<p><strong>Địa chỉ:</strong> ${p.address}</p>` : ""}
            ${p.grave_location ? `<p><strong>Mộ phần:</strong> ${p.grave_location}</p>` : ""}
            ${p.note ? `<p><strong>Ghi chú:</strong> ${p.note}</p>` : ""}
          `;
          document.getElementById("popup").style.display = "flex";
        } catch (e) {
          console.error("Lỗi detail");
        }
      }

      function closePopup() {
        document.getElementById("popup").style.display = "none";
      }

      window.onload = load;
      window.onresize = drawLines;
    </script>
  </body>
</html>
