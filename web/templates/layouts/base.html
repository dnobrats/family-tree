{{define "base"}}<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Gia phả dòng họ</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/print.css" media="print">
</head>
<body>
  <a class="skip-link" href="#main">Bỏ qua điều hướng</a>

  <header class="topbar no-print">
    <a class="brand" href="/tree">🌳 Gia phả</a>
    <nav class="nav">
      <a href="/tree">Cây gia phả</a>
      {{if .Admin}}
        <a href="/admin/persons">Thành viên</a>
        <a href="/admin/clans">Chi</a>
        <a href="/admin/persons/new">Thêm</a>
        <form method="post" action="/admin/logout" class="inline-form">
          <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
          <button type="submit" class="linklike">Đăng xuất</button>
        </form>
      {{else}}
        <a href="/admin/">Quản trị</a>
      {{end}}
    </nav>
  </header>

  <main id="main" class="container">
    {{if .Flash}}<div class="flash no-print" role="status">{{.Flash}}</div>{{end}}
    {{template "content" .}}
  </main>

  <footer class="footer no-print">Gia phả dòng họ · {{year}}</footer>

  <script src="/static/js/admin.js" defer></script>
</body>
</html>
{{end}}
